[tox]
envlist = test_run
skipdist = true
toxworkdir = {toxinidir}/tests/

[testenv]
install_command = pip install {opts} {packages}
setenv =
  PYTHONPATH=.
  TOX_PATH={toxinidir}
  PIP_PROGRESS_BAR=off
  PIP_DISABLE_PIP_VERSION_CHECK=1
  CI=1
allowlist_externals =
  {toxinidir}/dist/cli
  {toxinidir}\dist\cli.exe

[pytest]
filterwarnings = ignore::DeprecationWarning
markers =
  ubuntu: Test for Ubuntu
  windows: Test for Windows
  macos: Test for macOS (CocoaPods / Flutter fixtures)

[flake8]
max-line-length = 130
exclude = .tox/*

[testenv:test_run]
deps =
  -r{toxinidir}/requirements-dev.txt
commands =
  # Print Help Message
  fosslight_dependency -h
  # Test for PEP8
  flake8 src

[testenv:run_ubuntu]
deps =
  -r{toxinidir}/requirements-dev.txt
commands =
  # Disable pytest capture: with capture enabled, nested pip/venv I/O under the
  # scanner has intermittently produced empty DEP sheets (exit 0) on this suite.
  pytest -m "ubuntu" --capture=no

[testenv:run_windows]
deps =
  -r{toxinidir}\requirements-dev.txt
commands =
  # Test for making excutable file
  pyinstaller --onefile cli.py -n cli --additional-hooks-dir=hooks --add-binary=LICENSE:LICENSES --add-binary=LICENSES\LicenseRef-3rd-party-licenses.txt:LICENSES --collect-datas fosslight_util --hidden-import=_cffi_backend
  # Match ubuntu: nested pip/venv under capture has produced empty DEP sheets.
  pytest -m "windows" --capture=no

[testenv:run_macos]
deps =
  -r{toxinidir}/requirements-dev.txt
commands =
  pytest -m "macos"

[testenv:release_flake8]
deps =
  -r{toxinidir}/requirements-dev.txt
commands =
  flake8 src
