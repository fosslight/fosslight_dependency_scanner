# Running tests with tox for releasing new version

name: Pull requests fosslight_dependency_scanner

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  check-commit-message:
    uses: fosslight/.github/.github/workflows/base-check-commit-message.yml@main
    secrets:
      envPAT: ${{ secrets.GITHUB_TOKEN }}
  build_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.22'
        cache-dependency-path: tests/test_mod/go.mod
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libxslt-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
        sudo npm install -g license-checker
    - name: Flutter pub get for fixtures
      run: |
        flutter --version
        (cd tests/test_pub && flutter pub get)
        (cd tests/test_exclude && flutter pub get)
    - name: Go mod download for fixtures
      run: |
        go version
        (cd tests/test_mod && go mod download)
    - name: Set up Helm repos for fixtures
      run: |
        HELM_VERSION=v3.21.4
        HELM_ARCH=linux-amd64
        HELM_DIST="helm-${HELM_VERSION}-${HELM_ARCH}.tar.gz"
        curl -fsSL "https://get.helm.sh/${HELM_DIST}" -o "/tmp/${HELM_DIST}"
        curl -fsSL "https://get.helm.sh/${HELM_DIST}.sha256sum" -o "/tmp/${HELM_DIST}.sha256sum"
        echo "$(cut -d' ' -f1 /tmp/${HELM_DIST}.sha256sum)  /tmp/${HELM_DIST}" | sha256sum -c -
        tar -xzf "/tmp/${HELM_DIST}" -C /tmp
        sudo mv "/tmp/${HELM_ARCH}/helm" /usr/local/bin/helm
        helm version
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add jetstack https://charts.jetstack.io
        helm repo update
    - name: Run Tox
      run: |
        tox -e release_flake8
        tox -e run_ubuntu
  build_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.22'
        cache-dependency-path: tests/test_mod/go.mod
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Flutter pub get for fixtures
      shell: bash
      run: |
        flutter --version
        (cd tests/test_pub && flutter pub get)
        (cd tests/test_exclude && flutter pub get)
    - name: Go mod download for fixtures
      shell: bash
      run: |
        go version
        (cd tests/test_mod && go mod download)
    - name: Run Tox
      run: |
        tox -e run_windows
  build_macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.14'
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        cache: false
    - name: Install system dependencies
      run: |
        brew install libxml2 libxslt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install -r requirements-dev.txt
        npm install -g license-checker
    - name: Install Pod
      working-directory: ./tests/test_cocoapods/cocoapods-tips/JWSCocoapodsTips
      run: pod install --clean-install
    - name: Flutter pub get for fixtures
      run: |
        flutter --version
        (cd tests/test_pub && flutter pub get)
        (cd tests/test_exclude && flutter pub get)
    - name: Set TOKEN Environment Variable
      run: |
        if [ -z "${{ secrets.TOKEN }}" ]; then
          echo "TOKEN=dummy" >> $GITHUB_ENV
        else
          echo "TOKEN=${{ secrets.TOKEN }}" >> $GITHUB_ENV
        fi
    - name: Run Test
      run: |
        fosslight_dependency -p tests/test_pypi -o tests/result/pypi
        fosslight_dependency -p tests/test_npm1 -o tests/result/npm1
        fosslight_dependency -p tests/test_npm2 -o tests/result/npm2 -m npm
        fosslight_dependency -p tests/test_maven1/lombok.maven -o tests/result/maven1
        fosslight_dependency -p tests/test_maven2 -o tests/result/maven2
        fosslight_dependency -p tests/test_gradle/jib -o tests/result/gradle
        fosslight_dependency -p tests/test_swift -o tests/result/swift -t ${{ env.TOKEN }}
        fosslight_dependency -p tests/test_swift2 -o tests/result/swift2 -t ${{ env.TOKEN }}
        fosslight_dependency -p tests/test_swift2 -o tests/result/swift3 -t ${{ env.TOKEN }}
        fosslight_dependency -p tests/test_carthage -o tests/result/carthage -t ${{ env.TOKEN }}
    - name: Run macOS pytest (CocoaPods + pub with DEP row assert)
      env:
        PYTHONPATH: .
        TOX_PATH: ${{ github.workspace }}
      run: |
        mkdir -p tests/result/cocoapods tests/result/pub
        pytest -m macos
  reuse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: REUSE Compliance Check
      uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
